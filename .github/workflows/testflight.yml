name: TestFlight

# Uploads a build to TestFlight whenever iOS files change on main (for example
# when a fix PR merges). Run it by hand to upload the current main.
#
# Needs repo secrets from an App Store Connect API key with the Admin role
# (Admin lets Xcode create the distribution certificate and profiles):
#   ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8 (the contents of AuthKey_<id>.p8).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an upload partway through; queue the next one instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            echo "No usable base commit ($BEFORE); uploading a build."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(animango/|animango\.xcodeproj/|\.github/workflows/testflight\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Archive and upload to TestFlight
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - name: Write App Store Connect key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repo secrets."
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # A UTC timestamp always increases, so every upload has a new build number.
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project animango.xcodeproj \
            -scheme animango \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/animango.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>HU3934SYKA</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/animango.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          version=$(/usr/libexec/PlistBuddy -c 'Print ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/animango.xcarchive/Info.plist")
          {
            echo "### Uploaded animango $version ($BUILD_NUMBER) to TestFlight"
            echo "From commit ${GITHUB_SHA::7}. It appears in TestFlight once App Store Connect finishes processing it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
