name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Don't set `prompt`: it switches the action to automation mode and
          # stops it responding to @claude comments. Instructions are appended
          # to the default prompt instead.
          #
          # Claude opens its own PRs with gh. The only Bash commands allowed are
          # these gh pr subcommands. gh authenticates with the action's GitHub
          # App token, which is scoped to this repository (contents, pull
          # requests and issues write, plus actions read from
          # additional_permissions above), and --repo pins every call to it.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*)"
            --append-system-prompt "When you finish a task on a new branch, open the pull request yourself instead of posting a Create PR link. Do not post the compare or quick_pull link. First run gh pr list --repo ${{ github.repository }} --head <your branch> --state open, and if a PR already exists, link that one instead of creating another. Otherwise run gh pr create --repo ${{ github.repository }} --base <base branch> --head <your branch> --title <title> --body <body>. In the body, summarize the change, say how it was tested, and add Closes #<issue number> when the work came from an issue. Then put the PR URL in your comment. If gh pr create fails, say so in your comment and include the error. Only fall back to the Create PR link in that case."

